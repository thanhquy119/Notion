<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Thời tiết</title>
<style>
:root{--bg:#111112;--bg2:#18181a;--text:#f6f6f6;--muted:#a0a0a5;--line:rgba(255,255,255,.1);--icon:#eeeeef;--icon2:#b7b7bc}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--text);font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace}
button,input{font:inherit}
body{padding:1px}
.card{--radius:clamp(9px,3vmin,18px);position:relative;width:100%;height:100%;min-width:0;min-height:0;overflow:hidden;isolation:isolate;transform:translateZ(0);clip-path:inset(0 round var(--radius));border-radius:var(--radius);container-type:size;display:grid;grid-template-rows:minmax(0,1fr) auto;background:radial-gradient(circle at 51% 7%,rgba(255,255,255,.055),transparent 30%),linear-gradient(145deg,var(--bg2),var(--bg));transition:background .25s}
.card.rainy{--bg:#252628;--bg2:#3a3c3f;--icon:#e0e1e3;--icon2:#aeb1b5;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.09),transparent 34%),linear-gradient(145deg,#3b3d40,#202123)}.card.stormy{--bg:#202124;--bg2:#33353a;--icon:#e2e3e5;--icon2:#a5a8ad}
.top{min-height:0;overflow:visible;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:clamp(4px,3cqmin,16px);padding:clamp(9px,4cqmin,22px) clamp(9px,5cqmin,30px) clamp(7px,3.2cqmin,16px);padding-left:clamp(43px,13cqmin,61px)}
.location{min-width:0;overflow:visible}.city{margin:0;padding:.2em 0 .08em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(11px,6cqmin,31px);font-weight:800;line-height:1.35;letter-spacing:.025em;text-transform:uppercase}.label{margin:1px 0 0;color:var(--muted);font-size:clamp(6px,2.5cqmin,11px);letter-spacing:.11em}.updated{margin:clamp(3px,2cqmin,9px) 0 0;color:rgba(255,255,255,.44);font-size:clamp(6px,2cqmin,9px)}
.current-icon,.day-icon{display:grid;place-items:center;overflow:visible}.current-icon{width:clamp(38px,23cqmin,98px);height:clamp(38px,23cqmin,98px);justify-self:center}.current-icon svg,.day-icon svg{display:block;width:100%;height:100%;overflow:visible}.current{justify-self:end;min-width:0}.temp{margin:0;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:clamp(22px,15cqmin,68px);font-weight:700;letter-spacing:-.07em;line-height:1}.condition{margin:clamp(3px,2.2cqmin,10px) 0 0;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(7px,3cqmin,13px)}
.forecast{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);background:rgba(0,0,0,.08)}.day{position:relative;min-width:0;padding:clamp(4px,2.8cqmin,13px) clamp(2px,1.5cqmin,7px) clamp(5px,3cqmin,15px);text-align:center}.day+.day:before{content:"";position:absolute;left:0;top:12%;bottom:12%;width:1px;background:var(--line)}.day-name{margin:0 0 clamp(2px,1.4cqmin,6px);font-size:clamp(6px,2.4cqmin,10px);font-weight:800}.day-icon{width:clamp(20px,8cqmin,36px);height:clamp(20px,8cqmin,36px);margin:0 auto clamp(1px,1cqmin,4px)}.temps{font-size:clamp(7px,2.7cqmin,11px);font-weight:700;line-height:1.4}.low{display:block;color:var(--muted);font-weight:500}
.search{position:absolute;z-index:5;top:clamp(7px,2.7cqmin,11px);left:clamp(7px,2.7cqmin,11px);display:grid;place-items:center;width:clamp(27px,8cqmin,34px);height:clamp(27px,8cqmin,34px);border:1px solid rgba(255,255,255,.16);border-radius:50%;background:rgba(0,0,0,.14);color:#eee;cursor:pointer}.search svg{width:46%;height:46%}.panel{position:absolute;z-index:8;top:clamp(6px,2.5cqmin,10px);left:clamp(41px,12cqmin,52px);display:flex;gap:6px;width:min(340px,calc(100% - clamp(54px,16cqmin,68px)));padding:clamp(5px,1.8cqmin,7px);border:1px solid rgba(255,255,255,.16);border-radius:clamp(8px,2.5cqmin,11px);background:rgba(25,25,27,.97);opacity:0;pointer-events:none;transform:translateY(-4px);transition:.14s}.panel.open{opacity:1;pointer-events:auto;transform:none}.panel input{min-width:0;flex:1;border:0;outline:0;border-radius:7px;padding:clamp(5px,2cqmin,8px);background:rgba(255,255,255,.07);color:#fff;font-size:clamp(7px,2.4cqmin,11px)}.panel button{border:0;border-radius:7px;padding:0 clamp(7px,2.8cqmin,12px);background:#f0f0f0;color:#111;font-size:clamp(7px,2.4cqmin,11px);font-weight:700}
.status{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:22px;border-radius:inherit;background:rgba(18,18,19,.94);text-align:center;transition:.18s}.status.hide{opacity:0;pointer-events:none}.status p{margin:0;color:var(--muted);font-size:clamp(7px,2.5cqmin,12px);line-height:1.5}.status .error{color:#ff9b9b}.spin{width:clamp(18px,6cqmin,25px);height:clamp(18px,6cqmin,25px);margin:0 auto 8px;border:2px solid rgba(255,255,255,.18);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.float{animation:float 3.2s ease-in-out infinite}.rain-line{animation:rain .9s linear infinite}.rain-line:nth-child(2){animation-delay:-.3s}.rain-line:nth-child(3){animation-delay:-.6s}.bolt{animation:flash 2.2s ease-in-out infinite;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-3px)}}@keyframes rain{0%{transform:translateY(-3px);opacity:.2}100%{transform:translateY(7px);opacity:1}}@keyframes flash{0%,78%,100%{opacity:.42}82%,89%{opacity:1;filter:drop-shadow(0 0 5px rgba(255,255,255,.75))}}
@container (max-width:470px){.forecast{grid-template-columns:repeat(4,minmax(0,1fr))}.day:nth-child(5){display:none}.top{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);padding-right:8px}.label{display:none}}
@container (max-height:245px){.updated{display:none}.label{display:none}.top{padding-top:7px;padding-bottom:5px}.day{padding-top:3px;padding-bottom:4px}.current-icon{width:clamp(32px,20cqh,58px);height:clamp(32px,20cqh,58px)}.temp{font-size:clamp(20px,15cqh,42px)}}
@container (max-height:185px){.low{display:none}.condition{margin-top:2px}.day-icon{width:18px;height:18px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="card" id="card">
<button class="search" id="toggle" type="button" aria-label="Đổi thành phố"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5" stroke="currentColor" stroke-width="1.8"/><path d="m15 15 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
<form class="panel" id="panel" autocomplete="off"><input id="query" type="search" placeholder="Nhập thành phố, ví dụ: Huế"><button type="submit">Xem</button></form>
<section class="top"><div class="location"><h1 class="city" id="city">ĐÀ NẴNG</h1><p class="label">THỜI TIẾT</p><p class="updated" id="updated">Đang cập nhật…</p></div><div class="current-icon" id="icon" aria-hidden="true"></div><div class="current"><p class="temp"><span id="temp">--</span>°C</p><p class="condition" id="condition">Đang tải dữ liệu</p></div></section>
<section class="forecast" id="forecast" aria-label="Dự báo 5 ngày"></section>
<div class="status" id="status"><div><div class="spin" id="spin"></div><p id="message">Đang tải thời tiết Đà Nẵng…</p></div></div>
</main>
<script>
"use strict";
const DEFAULT={name:"Đà Nẵng",latitude:16.0678,longitude:108.2208};
const TEXT={0:"Trời quang",1:"Khá quang",2:"Có mây",3:"Nhiều mây",45:"Có sương mù",48:"Sương mù",51:"Mưa phùn nhẹ",53:"Mưa phùn",55:"Mưa phùn dày",56:"Mưa phùn lạnh",57:"Mưa phùn lạnh",61:"Mưa nhẹ",63:"Có mưa",65:"Mưa lớn",66:"Mưa lạnh",67:"Mưa lạnh",71:"Tuyết nhẹ",73:"Có tuyết",75:"Tuyết dày",77:"Hạt tuyết",80:"Mưa rào nhẹ",81:"Mưa rào",82:"Mưa rào lớn",85:"Tuyết rào",86:"Tuyết rào lớn",95:"Có dông",96:"Dông kèm mưa đá",99:"Dông mạnh"};
const DAYS=["CN","T2","T3","T4","T5","T6","T7"];
const $=selector=>document.querySelector(selector),el={card:$("#card"),city:$("#city"),temp:$("#temp"),condition:$("#condition"),icon:$("#icon"),updated:$("#updated"),forecast:$("#forecast"),status:$("#status"),message:$("#message"),spin:$("#spin"),panel:$("#panel"),query:$("#query"),toggle:$("#toggle")};
const isRain=code=>(code>=51&&code<=67)||(code>=80&&code<=82),isStorm=code=>code>=95,isSnow=code=>(code>=71&&code<=77)||(code>=85&&code<=86);
function svg(content,label){return`<svg viewBox="-12 -14 120 126" role="img" aria-label="${label}" xmlns="http://www.w3.org/2000/svg">${content}</svg>`}
function sun(){return`<g class="float"><circle cx="48" cy="48" r="14" fill="var(--icon)"/><g stroke="var(--icon)" stroke-width="4" stroke-linecap="round"><path d="M48 16v9M48 71v9M16 48h9M71 48h9"/><path d="m26 26 6 6m32 32 6 6m0-44-6 6M32 64l-6 6"/></g></g>`}
function moon(){return`<path class="float" d="M64 19c-19 4-29 25-18 41 9 13 26 16 39 7-6 14-20 22-35 20-20-2-35-19-33-39 2-17 15-31 32-34 5-1 11 1 15 5Z" fill="var(--icon)"/>`}
function cloud(scale=.82,x=-2,y=13,opacity=1){return`<g transform="translate(${x} ${y}) scale(${scale})" opacity="${opacity}"><path d="M25 65c-9 0-16-7-16-15s6-14 14-15c3-12 13-20 26-20 14 0 25 9 28 22 9 1 16 8 16 16 0 7-6 12-15 12H25Z" fill="var(--icon)" stroke="var(--icon2)" stroke-width="2"/></g>`}
function rain(){return`<g stroke="var(--icon2)" stroke-width="4" stroke-linecap="round"><path class="rain-line" d="M31 69l-4 10"/><path class="rain-line" d="M49 69l-4 10"/><path class="rain-line" d="M67 69l-4 10"/></g>`}
function snow(){return`<g fill="var(--icon2)"><circle cx="31" cy="75" r="3"/><circle cx="49" cy="79" r="3"/><circle cx="67" cy="74" r="3"/></g>`}
function fog(){return`<g stroke="var(--icon2)" stroke-width="4" stroke-linecap="round"><path d="M17 50h61"/><path d="M25 62h54"/><path d="M17 74h45"/></g>`}
function bolt(){return`<path class="bolt" d="M55 54H43l-6 26 22-31H48l7-17Z" fill="var(--icon)" stroke="var(--icon2)" stroke-width="1.4" stroke-linejoin="round"/>`}
function weatherIcon(code,day=true){const label=TEXT[code]||"Thời tiết";if(code===0)return svg(day?sun():moon(),label);if(code===1||code===2){const sky=day?`<g transform="translate(30 -10) scale(.66)">${sun()}</g>`:`<g transform="translate(31 -10) scale(.65)">${moon()}</g>`;return svg(`${sky}${cloud(.82,-2,18)}`,label)}if(code===3)return svg(`${cloud(.66,28,-3,.55)}${cloud(.82,-3,18)}`,label);if(code===45||code===48)return svg(`${cloud(.72,4,-9,.65)}${fog()}`,label);if(isStorm(code))return svg(`${cloud(.82,-2,-4)}${bolt()}${rain()}`,label);if(isSnow(code))return svg(`${cloud(.82,-2,-4)}${snow()}`,label);if(isRain(code))return svg(`${cloud(.82,-2,-4)}${rain()}`,label);return svg(cloud(),label)}
function theme(code){el.card.classList.toggle("rainy",isRain(code));el.card.classList.toggle("stormy",isStorm(code))}
function show(message,error=false){el.message.textContent=message;el.message.className=error?"error":"";el.spin.style.display=error?"none":"block";el.status.classList.remove("hide")}
function hide(){el.status.classList.add("hide")}
async function getWeather(location){const params=new URLSearchParams({latitude:location.latitude,longitude:location.longitude,current:"temperature_2m,weather_code,is_day",daily:"weather_code,temperature_2m_max,temperature_2m_min",temperature_unit:"celsius",timezone:"auto",forecast_days:"5"});const response=await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);if(!response.ok)throw Error(`Không tải được dữ liệu (${response.status}).`);return response.json()}
async function findCity(query){const params=new URLSearchParams({name:query,count:"1",language:"vi",format:"json"});const response=await fetch(`https://geocoding-api.open-meteo.com/v1/search?${params}`);if(!response.ok)throw Error("Không tìm được địa điểm.");const data=await response.json();if(!data.results?.length)throw Error("Không tìm thấy thành phố này.");const result=data.results[0];return{name:[result.name,result.admin1].filter((value,index,array)=>value&&array.indexOf(value)===index).join(", "),latitude:result.latitude,longitude:result.longitude}}
function render(location,data){const code=Number(data.current.weather_code),day=Number(data.current.is_day)===1;theme(code);el.city.textContent=location.name;el.temp.textContent=String(Math.round(data.current.temperature_2m));el.condition.textContent=TEXT[code]||"Thời tiết hiện tại";el.icon.innerHTML=weatherIcon(code,day);el.updated.textContent=`Cập nhật ${new Intl.DateTimeFormat("vi-VN",{hour:"2-digit",minute:"2-digit"}).format(new Date(data.current.time))}`;el.forecast.innerHTML=data.daily.time.map((date,index)=>{const name=index===0?"HÔM NAY":DAYS[new Date(`${date}T12:00:00`).getDay()],dailyCode=Number(data.daily.weather_code[index]);return`<article class="day"><p class="day-name">${name}</p><div class="day-icon">${weatherIcon(dailyCode,true)}</div><div class="temps">${Math.round(data.daily.temperature_2m_max[index])}°C<span class="low">${Math.round(data.daily.temperature_2m_min[index])}°C</span></div></article>`}).join("");document.title=`${Math.round(data.current.temperature_2m)}°C — ${location.name}`}
async function load(location,save=true){show(`Đang tải thời tiết ${location.name}…`);try{render(location,await getWeather(location));if(save)localStorage.setItem("weather-location",JSON.stringify(location));hide()}catch(error){show(`${error.message} Vui lòng tải lại trang.`,true)}}
function initial(){const params=new URLSearchParams(location.search),latitude=Number(params.get("lat")),longitude=Number(params.get("lon")),name=params.get("name");if(Number.isFinite(latitude)&&Number.isFinite(longitude)&&name)return{name,latitude,longitude};try{const stored=JSON.parse(localStorage.getItem("weather-location"));if(stored?.name&&Number.isFinite(Number(stored.latitude))&&Number.isFinite(Number(stored.longitude)))return stored}catch{}return DEFAULT}
el.toggle.addEventListener("click",()=>{el.panel.classList.toggle("open");if(el.panel.classList.contains("open"))setTimeout(()=>el.query.focus(),30)});el.panel.addEventListener("submit",async event=>{event.preventDefault();const query=el.query.value.trim();if(!query)return;el.panel.classList.remove("open");show(`Đang tìm “${query}”…`);try{const found=await findCity(query);el.query.value="";await load(found)}catch(error){show(error.message,true)}});document.addEventListener("click",event=>{if(!el.panel.contains(event.target)&&!el.toggle.contains(event.target))el.panel.classList.remove("open")});load(initial(),false);
</script>
</body>
</html>
