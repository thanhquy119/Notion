<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Thời tiết</title>
<style>
:root{--bg:#101011;--panel:#151516;--text:#f5f5f5;--muted:#9a9a9f;--line:#2a2a2d;--danger:#ff9b9b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:10px}.card{position:relative;width:min(1050px,100%);overflow:hidden;border:1px solid #252527;border-radius:22px;background:radial-gradient(circle at 50% 5%,#242426 0,transparent 32%),linear-gradient(135deg,#171718,#0d0d0e);box-shadow:0 22px 65px #0007}.top{display:grid;grid-template-columns:1fr 150px 1fr;align-items:center;gap:16px;min-height:185px;padding:35px 48px 22px}.city{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(20px,3vw,33px);letter-spacing:.04em;text-transform:uppercase}.label,.updated{margin:7px 0 0;color:var(--muted)}.label{font-size:14px;letter-spacing:.13em}.updated{font-size:11px}.icon{justify-self:center;font-size:78px;filter:drop-shadow(0 8px 18px #0008);animation:float 3.4s ease-in-out infinite}.current{justify-self:end}.temp{margin:0;font-size:clamp(50px,7vw,78px);font-weight:600;letter-spacing:-.07em;line-height:.9}.condition{margin:12px 0 0;font-size:16px}.forecast{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line)}.day{position:relative;padding:20px 10px 24px;text-align:center}.day+.day:before{content:"";position:absolute;left:0;top:20px;bottom:20px;width:1px;background:#242426}.day-name{margin:0 0 10px;font-size:13px;font-weight:700}.day-icon{font-size:35px;line-height:1.25}.temps{margin-top:8px;font-size:14px}.low{display:block;color:var(--muted);margin-top:2px}.search{position:absolute;top:14px;right:14px;width:35px;height:35px;border:1px solid #38383b;border-radius:50%;background:#ffffff0a;color:#ddd;cursor:pointer}.panel{position:absolute;z-index:5;top:13px;right:57px;display:flex;gap:7px;width:min(360px,calc(100% - 77px));padding:7px;border:1px solid #38383b;border-radius:12px;background:#171719f5;opacity:0;pointer-events:none;transform:translateY(-5px);transition:.15s}.panel.open{opacity:1;pointer-events:auto;transform:none}.panel input{min-width:0;flex:1;border:0;outline:0;border-radius:8px;background:#ffffff0d;color:white;padding:9px}.panel button{border:0;border-radius:8px;padding:0 13px;background:#eee;color:#111;font-weight:700;cursor:pointer}.status{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:#0e0e0fe8;text-align:center;transition:.2s}.status.hide{opacity:0;pointer-events:none}.status p{color:var(--muted);line-height:1.5}.status .error{color:var(--danger)}.spin{width:28px;height:28px;margin:0 auto 13px;border:2px solid #ffffff2c;border-top-color:white;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-4px)}}@media(max-width:700px){body{padding:6px}.top{grid-template-columns:1fr 90px 1fr;padding:34px 18px 18px;min-height:165px}.icon{font-size:55px}.city{font-size:18px}.label{font-size:10px}.updated{display:none}.condition{font-size:12px}.day{padding:16px 4px 20px}.day-name,.temps{font-size:11px}.day-icon{font-size:27px}}@media(max-width:430px){.forecast{grid-template-columns:repeat(4,1fr)}.day:nth-child(5){display:none}.top{grid-template-columns:1fr 65px 1fr}.icon{font-size:43px}.temp{font-size:43px}.label{display:none}}
</style>
</head>
<body>
<main class="card">
<button class="search" id="toggle" aria-label="Đổi thành phố">⌕</button>
<form class="panel" id="panel"><input id="query" placeholder="Nhập thành phố, ví dụ: Huế"><button>Xem</button></form>
<section class="top"><div><h1 class="city" id="city">ĐÀ NẴNG</h1><p class="label">THỜI TIẾT</p><p class="updated" id="updated">Đang cập nhật…</p></div><div class="icon" id="icon">☁️</div><div class="current"><p class="temp"><span id="temp">--</span>°C</p><p class="condition" id="condition">Đang tải dữ liệu</p></div></section>
<section class="forecast" id="forecast"></section>
<div class="status" id="status"><div><div class="spin" id="spin"></div><p id="message">Đang tải thời tiết Đà Nẵng…</p></div></div>
</main>
<script>
const DEFAULT={name:"Đà Nẵng",latitude:16.0678,longitude:108.2208};
const TEXT={0:"Trời quang",1:"Khá quang",2:"Có mây",3:"Nhiều mây",45:"Có sương mù",48:"Sương mù",51:"Mưa phùn nhẹ",53:"Mưa phùn",55:"Mưa phùn dày",61:"Mưa nhẹ",63:"Có mưa",65:"Mưa lớn",71:"Tuyết nhẹ",73:"Có tuyết",75:"Tuyết dày",80:"Mưa rào nhẹ",81:"Mưa rào",82:"Mưa rào lớn",95:"Có dông",96:"Dông kèm mưa đá",99:"Dông mạnh"};
const DAYS=["CN","T2","T3","T4","T5","T6","T7"];
const $=s=>document.querySelector(s),el={city:$("#city"),temp:$("#temp"),condition:$("#condition"),icon:$("#icon"),updated:$("#updated"),forecast:$("#forecast"),status:$("#status"),message:$("#message"),spin:$("#spin"),panel:$("#panel"),query:$("#query"),toggle:$("#toggle")};
function icon(code,day=true){if(code===0)return day?"☀️":"🌙";if(code<=2)return day?"🌤️":"☁️";if(code===3)return"☁️";if(code===45||code===48)return"🌫️";if(code>=95)return"⛈️";if((code>=71&&code<=77)||(code>=85&&code<=86))return"🌨️";if((code>=51&&code<=67)||(code>=80&&code<=82))return"🌧️";return"☁️"}
function show(msg,error=false){el.message.textContent=msg;el.message.className=error?"error":"";el.spin.style.display=error?"none":"block";el.status.classList.remove("hide")}
function hide(){el.status.classList.add("hide")}
async function weather(loc){const p=new URLSearchParams({latitude:loc.latitude,longitude:loc.longitude,current:"temperature_2m,weather_code,is_day",daily:"weather_code,temperature_2m_max,temperature_2m_min",temperature_unit:"celsius",timezone:"auto",forecast_days:"5"});const r=await fetch(`https://api.open-meteo.com/v1/forecast?${p}`);if(!r.ok)throw Error(`Không tải được dữ liệu (${r.status}).`);return r.json()}
async function findCity(q){const p=new URLSearchParams({name:q,count:"1",language:"vi",format:"json"});const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?${p}`);if(!r.ok)throw Error("Không tìm được địa điểm.");const d=await r.json();if(!d.results?.length)throw Error("Không tìm thấy thành phố này.");const x=d.results[0];return{name:[x.name,x.admin1].filter((v,i,a)=>v&&a.indexOf(v)===i).join(", "),latitude:x.latitude,longitude:x.longitude}}
function render(loc,d){const code=+d.current.weather_code;el.city.textContent=loc.name;el.temp.textContent=Math.round(d.current.temperature_2m);el.condition.textContent=TEXT[code]||"Thời tiết hiện tại";el.icon.textContent=icon(code,+d.current.is_day===1);el.updated.textContent=`Cập nhật ${new Intl.DateTimeFormat("vi-VN",{hour:"2-digit",minute:"2-digit"}).format(new Date(d.current.time))}`;el.forecast.innerHTML=d.daily.time.map((date,i)=>{const day=i===0?"HÔM NAY":DAYS[new Date(date+"T12:00:00").getDay()];return`<article class="day"><p class="day-name">${day}</p><div class="day-icon">${icon(+d.daily.weather_code[i])}</div><div class="temps">${Math.round(d.daily.temperature_2m_max[i])}°C<span class="low">${Math.round(d.daily.temperature_2m_min[i])}°C</span></div></article>`}).join("");document.title=`${Math.round(d.current.temperature_2m)}°C — ${loc.name}`}
async function load(loc,save=true){show(`Đang tải thời tiết ${loc.name}…`);try{render(loc,await weather(loc));if(save)localStorage.setItem("weather-location",JSON.stringify(loc));hide()}catch(e){show(`${e.message} Vui lòng tải lại trang.`,true)}}
function initial(){const p=new URLSearchParams(location.search),lat=+p.get("lat"),lon=+p.get("lon"),name=p.get("name");if(Number.isFinite(lat)&&Number.isFinite(lon)&&name)return{name,latitude:lat,longitude:lon};try{const x=JSON.parse(localStorage.getItem("weather-location"));if(x?.name&&Number.isFinite(+x.latitude)&&Number.isFinite(+x.longitude))return x}catch{}return DEFAULT}
el.toggle.onclick=()=>{el.panel.classList.toggle("open");if(el.panel.classList.contains("open"))setTimeout(()=>el.query.focus(),30)};
el.panel.onsubmit=async e=>{e.preventDefault();const q=el.query.value.trim();if(!q)return;el.panel.classList.remove("open");show(`Đang tìm “${q}”…`);try{const loc=await findCity(q);el.query.value="";await load(loc)}catch(err){show(err.message,true)}};
document.addEventListener("click",e=>{if(!el.panel.contains(e.target)&&e.target!==el.toggle)el.panel.classList.remove("open")});
load(initial(),false);
</script>
</body>
</html>
