<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Thời tiết</title>
<style>
:root{--bg:#111112;--bg2:#18181a;--text:#f6f6f6;--muted:#a0a0a5;--line:rgba(255,255,255,.10);--icon:#eeeeef;--icon2:#b7b7bc}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#191919;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{display:block}.card{position:relative;width:100%;height:100%;min-height:0;overflow:hidden;display:grid;grid-template-rows:minmax(0,1fr) auto;border:0;border-radius:0;box-shadow:none;background:radial-gradient(circle at 51% 7%,rgba(255,255,255,.055),transparent 30%),linear-gradient(145deg,var(--bg2),var(--bg));transition:background .25s ease}.card.rainy{--bg:#252628;--bg2:#3a3c3f;--icon:#e0e1e3;--icon2:#aeb1b5;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.08),transparent 34%),linear-gradient(145deg,#383a3d,#202123)}.card.stormy{--bg:#202124;--bg2:#33353a;--icon:#dedfe2;--icon2:#9ca0a6}.top{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 100px minmax(0,1fr);align-items:center;gap:14px;padding:25px 28px 18px}.city{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(18px,3.4vw,31px);font-weight:800;letter-spacing:.04em;text-transform:uppercase}.label{margin:7px 0 0;color:var(--muted);font-size:12px;letter-spacing:.14em}.updated{margin:9px 0 0;color:rgba(255,255,255,.42);font-size:10px}.current-icon,.day-icon{display:grid;place-items:center}.current-icon{width:88px;height:88px;justify-self:center}.current-icon svg,.day-icon svg{width:100%;height:100%;overflow:visible}.current{justify-self:end;min-width:0}.temp{margin:0;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:clamp(42px,7.4vw,68px);font-weight:650;letter-spacing:-.07em;line-height:.92}.condition{margin:11px 0 0;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.forecast{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);background:rgba(0,0,0,.08)}.day{position:relative;min-width:0;padding:15px 7px 17px;text-align:center}.day+.day::before{content:"";position:absolute;left:0;top:15px;bottom:15px;width:1px;background:var(--line)}.day-name{margin:0 0 7px;font-size:11px;font-weight:800;letter-spacing:.025em}.day-icon{width:34px;height:34px;margin:0 auto 6px}.temps{font-size:12px;font-weight:650;line-height:1.35}.low{display:block;color:var(--muted);font-weight:450}.search{position:absolute;z-index:5;top:12px;right:12px;display:grid;place-items:center;width:34px;height:34px;border:1px solid rgba(255,255,255,.16);border-radius:50%;background:rgba(0,0,0,.14);color:#eee;cursor:pointer}.search svg{width:15px;height:15px}.panel{position:absolute;z-index:8;top:11px;right:53px;display:flex;gap:7px;width:min(340px,calc(100% - 68px));padding:7px;border:1px solid rgba(255,255,255,.16);border-radius:11px;background:rgba(25,25,27,.97);opacity:0;pointer-events:none;transform:translateY(-4px);transition:.14s ease}.panel.open{opacity:1;pointer-events:auto;transform:none}.panel input{min-width:0;flex:1;border:0;outline:0;border-radius:7px;padding:8px 9px;background:rgba(255,255,255,.07);color:#fff;font:inherit}.panel button{border:0;border-radius:7px;padding:0 12px;background:#f0f0f0;color:#111;font:700 12px inherit;cursor:pointer}.status{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:22px;background:rgba(18,18,19,.93);text-align:center;transition:.18s}.status.hide{opacity:0;pointer-events:none}.status p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.status .error{color:#ff9b9b}.spin{width:25px;height:25px;margin:0 auto 11px;border:2px solid rgba(255,255,255,.18);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}.float{animation:float 3.2s ease-in-out infinite}.rain-line{animation:rain .9s linear infinite}.rain-line:nth-child(2){animation-delay:-.3s}.rain-line:nth-child(3){animation-delay:-.6s}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-3px)}}@keyframes rain{0%{transform:translateY(-3px);opacity:.15}100%{transform:translateY(6px);opacity:1}}@media(max-width:650px){.top{grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr);gap:7px;padding:24px 16px 14px}.current-icon{width:62px;height:62px}.city{font-size:17px}.label{font-size:9px}.updated{display:none}.temp{font-size:42px}.condition{font-size:11px}.day{padding:12px 4px 14px}.day-name,.temps{font-size:10px}.day-icon{width:29px;height:29px}}@media(max-width:470px){.forecast{grid-template-columns:repeat(4,minmax(0,1fr))}.day:nth-child(5){display:none}.top{grid-template-columns:minmax(0,1fr) 55px minmax(0,1fr);padding-inline:13px}.current-icon{width:48px;height:48px}.temp{font-size:36px}.label{display:none}}@media(max-height:330px){.top{padding-top:18px;padding-bottom:10px}.current-icon{width:56px;height:56px}.forecast .day{padding-top:9px;padding-bottom:10px}.day-icon{width:26px;height:26px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="card" id="card">
<button class="search" id="toggle" type="button" aria-label="Đổi thành phố"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5" stroke="currentColor" stroke-width="1.8"/><path d="m15 15 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
<form class="panel" id="panel" autocomplete="off"><input id="query" type="search" placeholder="Nhập thành phố, ví dụ: Huế"><button type="submit">Xem</button></form>
<section class="top"><div><h1 class="city" id="city">ĐÀ NẴNG</h1><p class="label">THỜI TIẾT</p><p class="updated" id="updated">Đang cập nhật…</p></div><div class="current-icon" id="icon" aria-hidden="true"></div><div class="current"><p class="temp"><span id="temp">--</span>°C</p><p class="condition" id="condition">Đang tải dữ liệu</p></div></section>
<section class="forecast" id="forecast" aria-label="Dự báo 5 ngày"></section>
<div class="status" id="status"><div><div class="spin" id="spin"></div><p id="message">Đang tải thời tiết Đà Nẵng…</p></div></div>
</main>
<script>
"use strict";
const DEFAULT={name:"Đà Nẵng",latitude:16.0678,longitude:108.2208};
const TEXT={0:"Trời quang",1:"Khá quang",2:"Có mây",3:"Nhiều mây",45:"Có sương mù",48:"Sương mù",51:"Mưa phùn nhẹ",53:"Mưa phùn",55:"Mưa phùn dày",56:"Mưa phùn lạnh",57:"Mưa phùn lạnh",61:"Mưa nhẹ",63:"Có mưa",65:"Mưa lớn",66:"Mưa lạnh",67:"Mưa lạnh",71:"Tuyết nhẹ",73:"Có tuyết",75:"Tuyết dày",77:"Hạt tuyết",80:"Mưa rào nhẹ",81:"Mưa rào",82:"Mưa rào lớn",85:"Tuyết rào",86:"Tuyết rào lớn",95:"Có dông",96:"Dông kèm mưa đá",99:"Dông mạnh"};
const DAYS=["CN","T2","T3","T4","T5","T6","T7"];
const $=s=>document.querySelector(s),el={card:$("#card"),city:$("#city"),temp:$("#temp"),condition:$("#condition"),icon:$("#icon"),updated:$("#updated"),forecast:$("#forecast"),status:$("#status"),message:$("#message"),spin:$("#spin"),panel:$("#panel"),query:$("#query"),toggle:$("#toggle")};
function isRain(code){return(code>=51&&code<=67)||(code>=80&&code<=82)}function isStorm(code){return code>=95}function isSnow(code){return(code>=71&&code<=77)||(code>=85&&code<=86)}
function svg(content,label){return`<svg viewBox="0 0 96 96" role="img" aria-label="${label}" xmlns="http://www.w3.org/2000/svg">${content}</svg>`}function sun(){return`<g class="float"><circle cx="48" cy="48" r="14" fill="var(--icon)"/><g stroke="var(--icon)" stroke-width="4" stroke-linecap="round"><path d="M48 16v9M48 71v9M16 48h9M71 48h9"/><path d="m26 26 6 6m32 32 6 6m0-44-6 6M32 64l-6 6"/></g></g>`}function moon(){return`<path class="float" d="M64 19c-19 4-29 25-18 41 9 13 26 16 39 7-6 14-20 22-35 20-20-2-35-19-33-39 2-17 15-31 32-34 5-1 11 1 15 5Z" fill="var(--icon)"/>`}function cloud(scale=1,dx=0,dy=0,opacity=1){return`<g transform="translate(${dx} ${dy}) scale(${scale})" opacity="${opacity}"><path d="M25 65c-9 0-16-7-16-15s6-14 14-15c3-12 13-20 26-20 14 0 25 9 28 22 9 1 16 8 16 16 0 7-6 12-15 12H25Z" fill="var(--icon)" stroke="var(--icon2)" stroke-width="2"/></g>`}function rain(){return`<g stroke="var(--icon2)" stroke-width="4" stroke-linecap="round"><path class="rain-line" d="M31 70l-4 9"/><path class="rain-line" d="M49 70l-4 9"/><path class="rain-line" d="M67 70l-4 9"/></g>`}function snow(){return`<g fill="var(--icon2)"><circle cx="31" cy="75" r="3"/><circle cx="49" cy="79" r="3"/><circle cx="67" cy="74" r="3"/></g>`}function fog(){return`<g stroke="var(--icon2)" stroke-width="4" stroke-linecap="round"><path d="M17 50h61"/><path d="M25 62h54"/><path d="M17 74h45"/></g>`}function bolt(){return`<path d="M54 58H43l-5 21 20-27H47l7-16Z" fill="var(--icon)" stroke="var(--icon2)" stroke-width="1.5" stroke-linejoin="round"/>`}
function weatherIcon(code,day=true){const label=TEXT[code]||"Thời tiết";if(code===0)return svg(day?sun():moon(),label);if(code===1||code===2){const sky=day?`<g transform="translate(30 -10) scale(.66)">${sun()}</g>`:`<g transform="translate(31 -10) scale(.65)">${moon()}</g>`;return svg(`${sky}${cloud(.82,-2,18)}`,label)}if(code===3)return svg(`${cloud(.66,28,-3,.55)}${cloud(.82,-3,18)}`,label);if(code===45||code===48)return svg(`${cloud(.72,4,-9,.65)}${fog()}`,label);if(isStorm(code))return svg(`${cloud(.82,-2,-4)}${bolt()}${rain()}`,label);if(isSnow(code))return svg(`${cloud(.82,-2,-4)}${snow()}`,label);if(isRain(code))return svg(`${cloud(.82,-2,-4)}${rain()}`,label);return svg(cloud(.82,-2,13),label)}
function theme(code){el.card.classList.toggle("rainy",isRain(code));el.card.classList.toggle("stormy",isStorm(code))}function show(msg,error=false){el.message.textContent=msg;el.message.className=error?"error":"";el.spin.style.display=error?"none":"block";el.status.classList.remove("hide")}function hide(){el.status.classList.add("hide")}
async function getWeather(loc){const p=new URLSearchParams({latitude:loc.latitude,longitude:loc.longitude,current:"temperature_2m,weather_code,is_day",daily:"weather_code,temperature_2m_max,temperature_2m_min",temperature_unit:"celsius",timezone:"auto",forecast_days:"5"});const r=await fetch(`https://api.open-meteo.com/v1/forecast?${p}`);if(!r.ok)throw Error(`Không tải được dữ liệu (${r.status}).`);return r.json()}
async function findCity(q){const p=new URLSearchParams({name:q,count:"1",language:"vi",format:"json"});const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?${p}`);if(!r.ok)throw Error("Không tìm được địa điểm.");const d=await r.json();if(!d.results?.length)throw Error("Không tìm thấy thành phố này.");const x=d.results[0];return{name:[x.name,x.admin1].filter((v,i,a)=>v&&a.indexOf(v)===i).join(", "),latitude:x.latitude,longitude:x.longitude}}
function render(loc,d){const code=Number(d.current.weather_code),day=Number(d.current.is_day)===1;theme(code);el.city.textContent=loc.name;el.temp.textContent=Math.round(d.current.temperature_2m);el.condition.textContent=TEXT[code]||"Thời tiết hiện tại";el.icon.innerHTML=weatherIcon(code,day);el.updated.textContent=`Cập nhật ${new Intl.DateTimeFormat("vi-VN",{hour:"2-digit",minute:"2-digit"}).format(new Date(d.current.time))}`;el.forecast.innerHTML=d.daily.time.map((date,i)=>{const name=i===0?"HÔM NAY":DAYS[new Date(date+"T12:00:00").getDay()],dailyCode=Number(d.daily.weather_code[i]);return`<article class="day"><p class="day-name">${name}</p><div class="day-icon">${weatherIcon(dailyCode,true)}</div><div class="temps">${Math.round(d.daily.temperature_2m_max[i])}°C<span class="low">${Math.round(d.daily.temperature_2m_min[i])}°C</span></div></article>`}).join("");document.title=`${Math.round(d.current.temperature_2m)}°C — ${loc.name}`}
async function load(loc,save=true){show(`Đang tải thời tiết ${loc.name}…`);try{render(loc,await getWeather(loc));if(save)localStorage.setItem("weather-location",JSON.stringify(loc));hide()}catch(err){show(`${err.message} Vui lòng tải lại trang.`,true)}}
function initial(){const p=new URLSearchParams(location.search),lat=Number(p.get("lat")),lon=Number(p.get("lon")),name=p.get("name");if(Number.isFinite(lat)&&Number.isFinite(lon)&&name)return{name,latitude:lat,longitude:lon};try{const x=JSON.parse(localStorage.getItem("weather-location"));if(x?.name&&Number.isFinite(Number(x.latitude))&&Number.isFinite(Number(x.longitude)))return x}catch{}return DEFAULT}
el.toggle.addEventListener("click",()=>{el.panel.classList.toggle("open");if(el.panel.classList.contains("open"))setTimeout(()=>el.query.focus(),30)});el.panel.addEventListener("submit",async e=>{e.preventDefault();const q=el.query.value.trim();if(!q)return;el.panel.classList.remove("open");show(`Đang tìm “${q}”…`);try{const loc=await findCity(q);el.query.value="";await load(loc)}catch(err){show(err.message,true)}});document.addEventListener("click",e=>{if(!el.panel.contains(e.target)&&!el.toggle.contains(e.target))el.panel.classList.remove("open")});load(initial(),false);
</script>
</body>
</html>
