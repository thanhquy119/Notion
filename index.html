<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Notion Widgets</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"JetBrains Mono",ui-monospace,monospace;background:#0f0f10;color:#f7f7f7}
body{display:grid;place-items:center;padding:30px}main{width:min(900px,100%)}h1{margin:0;font-size:clamp(28px,6vw,54px);letter-spacing:-.05em}
p{color:#999;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:25px}
a{display:block;padding:22px;border:1px solid #29292d;border-radius:18px;background:#151516;color:inherit;text-decoration:none}
a:hover{border-color:#666}strong{display:block;margin-bottom:7px;font-size:18px}span{color:#999;font-size:12px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main><h1>Notion Widgets</h1><p>Bộ widget trắng–đen cho dashboard học tập.</p><section class="grid">
<a href="/weather/"><strong>Weather</strong><span>Thời tiết Đà Nẵng và dự báo 5 ngày</span></a>
<a href="/pomodoro/"><strong>Pomodoro</strong><span>Tùy chỉnh thời gian và tự chuyển phiên</span></a>
<a href="/clock/"><strong>Clock</strong><span>Đồng hồ Việt Nam analog + digital</span></a>
<a href="/calendar/"><strong>Calendar</strong><span>Lịch tháng tối giản</span></a>
</section></main></body></html>
