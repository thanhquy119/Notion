<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Pomodoro</title>
  <style>
    :root{
      --bg:#0f0f10;
      --panel:#151516;
      --panel-2:#19191b;
      --text:#f7f7f7;
      --muted:#96969b;
      --line:#2b2b2e;
      --track:#29292c;
      --progress:#f1f1f1;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:transparent;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    body{min-height:100vh;display:grid;place-items:center;padding:10px}
    button{font:inherit}
    .card{
      width:min(760px,100%);
      min-height:390px;
      display:grid;
      grid-template-columns:minmax(260px,1fr) minmax(250px,.9fr);
      overflow:hidden;
      border:1px solid rgba(255,255,255,.07);
      border-radius:24px;
      background:
        radial-gradient(circle at 25% 18%,rgba(255,255,255,.035),transparent 30%),
        linear-gradient(135deg,#171718,#0e0e0f);
      box-shadow:0 24px 70px rgba(0,0,0,.38);
    }
    .timer-panel{
      display:grid;
      place-items:center;
      padding:34px 26px;
      border-right:1px solid var(--line);
    }
    .timer-wrap{
      position:relative;
      width:min(300px,78vw);
      aspect-ratio:1;
      display:grid;
      place-items:center;
    }
    .ring{
      position:absolute;
      inset:0;
      transform:rotate(-90deg);
      overflow:visible;
    }
    .ring circle{fill:none;stroke-width:7}
    .ring .track{stroke:var(--track)}
    .ring .progress{
      stroke:var(--progress);
      stroke-linecap:round;
      transition:stroke-dashoffset .35s linear;
      filter:drop-shadow(0 0 7px rgba(255,255,255,.1));
    }
    .timer-content{text-align:center;z-index:1}
    .mode-label{
      margin:0 0 9px;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
      letter-spacing:.18em;
      text-transform:uppercase;
    }
    .time{
      margin:0;
      font-variant-numeric:tabular-nums;
      font-size:clamp(64px,10vw,96px);
      font-weight:570;
      letter-spacing:-.07em;
      line-height:.95;
    }
    .session-line{
      margin:14px 0 0;
      color:var(--muted);
      font-size:13px;
    }
    .controls{
      display:flex;
      justify-content:center;
      gap:10px;
      margin-top:25px;
    }
    .controls button,.mode-buttons button{
      border:1px solid var(--line);
      color:var(--text);
      cursor:pointer;
      transition:.15s ease;
    }
    .controls button{
      min-width:92px;
      border-radius:999px;
      padding:11px 18px;
      background:var(--panel-2);
      font-weight:650;
    }
    .controls .primary{
      background:#f2f2f2;
      color:#111;
      border-color:#f2f2f2;
    }
    button:hover{transform:translateY(-1px);border-color:#56565a}
    button:active{transform:translateY(0)}
    .side{
      display:flex;
      flex-direction:column;
      justify-content:center;
      padding:34px 30px;
    }
    .side h1{
      margin:0 0 7px;
      font-size:29px;
      letter-spacing:-.04em;
    }
    .side>p{
      margin:0;
      color:var(--muted);
      line-height:1.55;
      font-size:14px;
    }
    .mode-buttons{
      display:grid;
      gap:9px;
      margin-top:27px;
    }
    .mode-buttons button{
      display:flex;
      justify-content:space-between;
      align-items:center;
      width:100%;
      border-radius:13px;
      padding:13px 15px;
      background:rgba(255,255,255,.025);
      text-align:left;
    }
    .mode-buttons button.active{
      border-color:#777;
      background:rgba(255,255,255,.08);
    }
    .mode-buttons small{color:var(--muted)}
    .options{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-top:22px;
      padding-top:19px;
      border-top:1px solid var(--line);
      color:var(--muted);
      font-size:13px;
    }
    .switch{
      position:relative;
      width:42px;
      height:23px;
      flex:0 0 auto;
    }
    .switch input{position:absolute;opacity:0;pointer-events:none}
    .switch span{
      position:absolute;inset:0;
      border:1px solid #444;
      border-radius:999px;
      background:#252527;
      cursor:pointer;
      transition:.15s ease;
    }
    .switch span::after{
      content:"";
      position:absolute;
      width:15px;height:15px;
      left:3px;top:3px;
      border-radius:50%;
      background:#8a8a8e;
      transition:.15s ease;
    }
    .switch input:checked+span{background:#efefef;border-color:#efefef}
    .switch input:checked+span::after{transform:translateX(19px);background:#111}
    @media(max-width:680px){
      body{padding:6px}
      .card{grid-template-columns:1fr;min-height:0}
      .timer-panel{border-right:0;border-bottom:1px solid var(--line);padding:24px 18px}
      .timer-wrap{width:min(245px,70vw)}
      .time{font-size:67px}
      .side{padding:23px 22px 26px}
      .side h1,.side>p{display:none}
      .mode-buttons{margin-top:0;grid-template-columns:repeat(3,1fr)}
      .mode-buttons button{display:block;padding:11px 7px;text-align:center}
      .mode-buttons small{display:block;margin-top:3px}
      .options{margin-top:16px;padding-top:15px}
    }
    @media(max-width:430px){
      .timer-wrap{width:210px}
      .controls button{min-width:78px;padding-inline:13px}
      .mode-buttons button{font-size:12px}
    }
    @media(prefers-reduced-motion:reduce){
      *{transition:none!important}
    }
  </style>
</head>
<body>
  <main class="card">
    <section class="timer-panel">
      <div>
        <div class="timer-wrap">
          <svg class="ring" viewBox="0 0 220 220" aria-hidden="true">
            <circle class="track" cx="110" cy="110" r="100"></circle>
            <circle class="progress" id="progress" cx="110" cy="110" r="100"></circle>
          </svg>
          <div class="timer-content">
            <p class="mode-label" id="modeLabel">Tập trung</p>
            <p class="time" id="time">25:00</p>
            <p class="session-line">Phiên hoàn thành: <span id="sessions">0</span></p>
          </div>
        </div>
        <div class="controls">
          <button class="primary" id="startPause" type="button">Bắt đầu</button>
          <button id="reset" type="button">Đặt lại</button>
        </div>
      </div>
    </section>

    <section class="side">
      <h1>Pomodoro</h1>
      <p>Tập trung vào một việc. Nghỉ ngắn giữa các phiên và nghỉ dài sau bốn phiên.</p>

      <div class="mode-buttons" id="modeButtons">
        <button class="active" type="button" data-mode="focus">
          <span>Tập trung</span><small>25 phút</small>
        </button>
        <button type="button" data-mode="short">
          <span>Nghỉ ngắn</span><small>5 phút</small>
        </button>
        <button type="button" data-mode="long">
          <span>Nghỉ dài</span><small>15 phút</small>
        </button>
      </div>

      <div class="options">
        <span>Âm báo khi hết giờ</span>
        <label class="switch" aria-label="Bật hoặc tắt âm báo">
          <input id="soundToggle" type="checkbox" checked>
          <span></span>
        </label>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    const MODES = {
      focus: { label: "Tập trung", seconds: 25 * 60 },
      short: { label: "Nghỉ ngắn", seconds: 5 * 60 },
      long:  { label: "Nghỉ dài", seconds: 15 * 60 }
    };

    const els = {
      time: document.getElementById("time"),
      modeLabel: document.getElementById("modeLabel"),
      progress: document.getElementById("progress"),
      startPause: document.getElementById("startPause"),
      reset: document.getElementById("reset"),
      sessions: document.getElementById("sessions"),
      soundToggle: document.getElementById("soundToggle"),
      modeButtons: document.getElementById("modeButtons")
    };

    const radius = 100;
    const circumference = 2 * Math.PI * radius;
    els.progress.style.strokeDasharray = `${circumference} ${circumference}`;

    let mode = "focus";
    let remaining = MODES[mode].seconds;
    let timerId = null;
    let endAt = null;
    let completedSessions = Number(localStorage.getItem("pomodoro-completed") || 0);

    try {
      const savedSound = localStorage.getItem("pomodoro-sound");
      if (savedSound !== null) els.soundToggle.checked = savedSound === "true";
    } catch {}

    els.sessions.textContent = completedSessions;

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    function render() {
      const total = MODES[mode].seconds;
      const progress = Math.max(0, Math.min(1, remaining / total));
      els.time.textContent = formatTime(remaining);
      els.modeLabel.textContent = MODES[mode].label;
      els.progress.style.strokeDashoffset = circumference * (1 - progress);
      document.title = `${formatTime(remaining)} — ${MODES[mode].label}`;
    }

    function stopTimer() {
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
      }
      endAt = null;
      els.startPause.textContent = "Bắt đầu";
    }

    function tick() {
      if (!endAt) return;
      remaining = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
      render();

      if (remaining <= 0) {
        finishTimer();
      }
    }

    function startTimer() {
      if (remaining <= 0) remaining = MODES[mode].seconds;
      endAt = Date.now() + remaining * 1000;
      timerId = setInterval(tick, 250);
      els.startPause.textContent = "Tạm dừng";
      tick();
    }

    function pauseTimer() {
      tick();
      stopTimer();
    }

    function beep() {
      if (!els.soundToggle.checked) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        const now = ctx.currentTime;

        [0, 0.24, 0.48].forEach((delay) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(740, now + delay);
          gain.gain.setValueAtTime(0.0001, now + delay);
          gain.gain.exponentialRampToValueAtTime(0.16, now + delay + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + delay + 0.16);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + delay);
          osc.stop(now + delay + 0.18);
        });

        setTimeout(() => ctx.close(), 1000);
      } catch {}
    }

    function finishTimer() {
      stopTimer();
      remaining = 0;
      render();
      beep();

      if (mode === "focus") {
        completedSessions += 1;
        els.sessions.textContent = completedSessions;
        try {
          localStorage.setItem("pomodoro-completed", completedSessions);
        } catch {}

        setTimeout(() => {
          const nextMode = completedSessions % 4 === 0 ? "long" : "short";
          setMode(nextMode);
        }, 700);
      }
    }

    function setMode(nextMode) {
      stopTimer();
      mode = nextMode;
      remaining = MODES[mode].seconds;

      document.querySelectorAll("[data-mode]").forEach((button) => {
        button.classList.toggle("active", button.dataset.mode === mode);
      });

      render();
    }

    els.startPause.addEventListener("click", () => {
      if (timerId === null) startTimer();
      else pauseTimer();
    });

    els.reset.addEventListener("click", () => {
      stopTimer();
      remaining = MODES[mode].seconds;
      render();
    });

    els.modeButtons.addEventListener("click", (event) => {
      const button = event.target.closest("[data-mode]");
      if (button) setMode(button.dataset.mode);
    });

    els.soundToggle.addEventListener("change", () => {
      try {
        localStorage.setItem("pomodoro-sound", String(els.soundToggle.checked));
      } catch {}
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && timerId !== null) tick();
    });

    render();
  </script>
</body>
</html>
