<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Pomodoro</title>
<style>
:root{--text:#f7f7f7;--muted:#96969b;--line:#2b2b2e;--track:#29292c;--progress:#f1f1f1;--radius:18px}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--text);font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace}body{display:grid;place-items:center}button{font:inherit}.card{width:100%;height:100%;display:grid;grid-template-columns:minmax(260px,1fr) minmax(250px,.9fr);overflow:hidden;border-radius:var(--radius);background:radial-gradient(circle at 25% 18%,rgba(255,255,255,.035),transparent 30%),linear-gradient(135deg,#171718,#0e0e0f)}.timer-panel{display:grid;place-items:center;padding:24px;border-right:1px solid var(--line)}.timer-wrap{position:relative;width:min(250px,60vh,78vw);aspect-ratio:1;display:grid;place-items:center}.ring{position:absolute;inset:0;transform:rotate(-90deg);overflow:visible}.ring circle{fill:none;stroke-width:7}.track{stroke:var(--track)}.progress{stroke:var(--progress);stroke-linecap:round;transition:stroke-dashoffset .35s linear}.timer-content{text-align:center;z-index:1}.mode-label{margin:0 0 8px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.time{margin:0;font-variant-numeric:tabular-nums;font-size:clamp(55px,9vw,84px);font-weight:700;letter-spacing:-.07em;line-height:1}.session-line{margin:12px 0 0;color:var(--muted);font-size:11px}.controls{display:flex;justify-content:center;gap:9px;margin-top:18px}.controls button,.mode-buttons button{border:1px solid var(--line);color:var(--text);cursor:pointer;transition:.15s}.controls button{min-width:84px;border-radius:999px;padding:10px 15px;background:#19191b;font-weight:700}.controls .primary{background:#f2f2f2;color:#111;border-color:#f2f2f2}.side{display:flex;flex-direction:column;justify-content:center;padding:26px}.side h1{margin:0 0 7px;font-size:27px;line-height:1.25}.side>p{margin:0;color:var(--muted);line-height:1.55;font-size:12px}.mode-buttons{display:grid;gap:8px;margin-top:22px}.mode-buttons button{display:flex;justify-content:space-between;align-items:center;width:100%;border-radius:12px;padding:12px 14px;background:rgba(255,255,255,.025);text-align:left;font-size:12px}.mode-buttons button.active{border-color:#777;background:rgba(255,255,255,.08)}.mode-buttons small{color:var(--muted)}.options{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.switch{position:relative;width:42px;height:23px}.switch input{position:absolute;opacity:0}.switch span{position:absolute;inset:0;border:1px solid #444;border-radius:999px;background:#252527;cursor:pointer}.switch span:after{content:"";position:absolute;width:15px;height:15px;left:3px;top:3px;border-radius:50%;background:#8a8a8e;transition:.15s}.switch input:checked+span{background:#efefef}.switch input:checked+span:after{transform:translateX(19px);background:#111}@media(max-width:680px){.card{grid-template-columns:1fr}.timer-panel{border-right:0;border-bottom:1px solid var(--line);padding:18px}.timer-wrap{width:min(205px,47vh,65vw)}.time{font-size:58px}.side{padding:18px}.side h1,.side>p{display:none}.mode-buttons{margin-top:0;grid-template-columns:repeat(3,1fr)}.mode-buttons button{display:block;padding:9px 5px;text-align:center;font-size:10px}.mode-buttons small{display:block;margin-top:3px}.options{margin-top:12px;padding-top:12px}}@media(max-height:380px){.timer-wrap{width:min(180px,45vh)}.controls{margin-top:12px}.side{padding:14px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="card"><section class="timer-panel"><div><div class="timer-wrap"><svg class="ring" viewBox="-6 -6 232 232" aria-hidden="true"><circle class="track" cx="110" cy="110" r="100"></circle><circle class="progress" id="progress" cx="110" cy="110" r="100"></circle></svg><div class="timer-content"><p class="mode-label" id="modeLabel">Tập trung</p><p class="time" id="time">25:00</p><p class="session-line">Phiên hoàn thành: <span id="sessions">0</span></p></div></div><div class="controls"><button class="primary" id="startPause" type="button">Bắt đầu</button><button id="reset" type="button">Đặt lại</button></div></div></section><section class="side"><h1>Pomodoro</h1><p>Tập trung vào một việc. Nghỉ ngắn giữa các phiên và nghỉ dài sau bốn phiên.</p><div class="mode-buttons" id="modeButtons"><button class="active" type="button" data-mode="focus"><span>Tập trung</span><small>25 phút</small></button><button type="button" data-mode="short"><span>Nghỉ ngắn</span><small>5 phút</small></button><button type="button" data-mode="long"><span>Nghỉ dài</span><small>15 phút</small></button></div><div class="options"><span>Âm báo khi hết giờ</span><label class="switch" aria-label="Bật hoặc tắt âm báo"><input id="soundToggle" type="checkbox" checked><span></span></label></div></section></main>
<script>
"use strict";
const MODES={focus:{label:"Tập trung",seconds:1500},short:{label:"Nghỉ ngắn",seconds:300},long:{label:"Nghỉ dài",seconds:900}};
const el={time:document.getElementById("time"),modeLabel:document.getElementById("modeLabel"),progress:document.getElementById("progress"),startPause:document.getElementById("startPause"),reset:document.getElementById("reset"),sessions:document.getElementById("sessions"),soundToggle:document.getElementById("soundToggle"),modeButtons:document.getElementById("modeButtons")};
const circumference=2*Math.PI*100;el.progress.style.strokeDasharray=`${circumference} ${circumference}`;let mode="focus",remaining=MODES[mode].seconds,timerId=null,endAt=null,completed=Number(localStorage.getItem("pomodoro-completed")||0);try{const saved=localStorage.getItem("pomodoro-sound");if(saved!==null)el.soundToggle.checked=saved==="true"}catch{}el.sessions.textContent=completed;
function formatTime(seconds){return`${String(Math.floor(seconds/60)).padStart(2,"0")}:${String(seconds%60).padStart(2,"0")}`}
function render(){const total=MODES[mode].seconds,ratio=Math.max(0,Math.min(1,remaining/total));el.time.textContent=formatTime(remaining);el.modeLabel.textContent=MODES[mode].label;el.progress.style.strokeDashoffset=circumference*(1-ratio);document.title=`${formatTime(remaining)} — ${MODES[mode].label}`}
function stop(){if(timerId!==null){clearInterval(timerId);timerId=null}endAt=null;el.startPause.textContent="Bắt đầu"}
function tick(){if(!endAt)return;remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));render();if(remaining<=0)finish()}
function start(){if(remaining<=0)remaining=MODES[mode].seconds;endAt=Date.now()+remaining*1000;timerId=setInterval(tick,250);el.startPause.textContent="Tạm dừng";tick()}
function beep(){if(!el.soundToggle.checked)return;try{const AudioContext=window.AudioContext||window.webkitAudioContext,ctx=new AudioContext(),now=ctx.currentTime;[0,.24,.48].forEach(delay=>{const osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=740;gain.gain.setValueAtTime(.0001,now+delay);gain.gain.exponentialRampToValueAtTime(.15,now+delay+.02);gain.gain.exponentialRampToValueAtTime(.0001,now+delay+.16);osc.connect(gain);gain.connect(ctx.destination);osc.start(now+delay);osc.stop(now+delay+.18)});setTimeout(()=>ctx.close(),1000)}catch{}}
function finish(){stop();remaining=0;render();beep();if(mode==="focus"){completed++;el.sessions.textContent=completed;try{localStorage.setItem("pomodoro-completed",completed)}catch{}setTimeout(()=>setMode(completed%4===0?"long":"short"),700)}}
function setMode(next){stop();mode=next;remaining=MODES[mode].seconds;document.querySelectorAll("[data-mode]").forEach(button=>button.classList.toggle("active",button.dataset.mode===mode));render()}
el.startPause.addEventListener("click",()=>timerId===null?start():(tick(),stop()));el.reset.addEventListener("click",()=>{stop();remaining=MODES[mode].seconds;render()});el.modeButtons.addEventListener("click",event=>{const button=event.target.closest("[data-mode]");if(button)setMode(button.dataset.mode)});el.soundToggle.addEventListener("change",()=>{try{localStorage.setItem("pomodoro-sound",String(el.soundToggle.checked))}catch{}});document.addEventListener("visibilitychange",()=>{if(!document.hidden&&timerId!==null)tick()});render();
</script>
</body>
</html>
