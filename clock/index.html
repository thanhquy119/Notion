<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Clock</title>
<style>
:root{--text:#f7f7f7;--muted:#99999e;--line:rgba(255,255,255,.13)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--text);font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace}
body{padding:1px}
.card{--radius:clamp(9px,3vmin,18px);width:100%;height:100%;min-width:0;min-height:0;overflow:hidden;isolation:isolate;transform:translateZ(0);clip-path:inset(0 round var(--radius));border-radius:var(--radius);container-type:size;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1fr);align-items:center;gap:clamp(4px,2cqmin,14px);padding:clamp(8px,4cqmin,22px);background:radial-gradient(circle at 20% 8%,rgba(255,255,255,.055),transparent 35%),linear-gradient(145deg,#18181a,#0f0f10)}
.face{width:clamp(68px,42cqmin,174px);height:clamp(68px,42cqmin,174px);max-width:100%;max-height:100%;margin:auto;overflow:visible}
.face circle.frame{fill:none;stroke:var(--line);stroke-width:.8}.face .tick{stroke:#9d9da1;stroke-width:.75;stroke-linecap:round}.face .tick.major{stroke:#eeeeef;stroke-width:1.35}.face .hour{stroke:#f4f4f4;stroke-width:3.2}.face .minute{stroke:#d4d4d6;stroke-width:2.2}.face .second{stroke:#7f7f84;stroke-width:.8}.face .hand{stroke-linecap:round}.face .center{fill:#f4f4f4}
.digital{min-width:0;text-align:left}
.time{margin:0;font-size:clamp(20px,12cqmin,62px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.075em;white-space:nowrap}
.seconds{font-size:.42em;color:var(--muted);letter-spacing:-.04em}
.day{margin:clamp(5px,3cqmin,13px) 0 0;color:#e8e8e8;font-size:clamp(8px,3.2cqmin,13px);font-weight:700;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
.date{margin:clamp(3px,1.8cqmin,8px) 0 0;color:var(--muted);font-size:clamp(7px,2.7cqmin,11px);white-space:nowrap}
@container (max-width:330px){.card{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:2px;padding:clamp(6px,3cqmin,14px)}.face{width:clamp(62px,34cqmin,128px);height:clamp(62px,34cqmin,128px)}.digital{text-align:center}.time{font-size:clamp(18px,10cqmin,38px)}.day{margin-top:3px}.date{margin-top:2px}}
@container (max-height:220px){.card{grid-template-columns:minmax(0,.7fr) minmax(0,1fr);grid-template-rows:1fr;padding:6px}.face{width:clamp(56px,37cqh,112px);height:clamp(56px,37cqh,112px)}.digital{text-align:left}.time{font-size:clamp(18px,11cqh,34px)}.day{font-size:clamp(7px,4cqh,10px);margin-top:3px}.date{font-size:clamp(6px,3.5cqh,9px);margin-top:2px}}
</style>
</head>
<body>
<main class="card">
<svg class="face" viewBox="-3 -3 106 106" aria-hidden="true"><circle class="frame" cx="50" cy="50" r="46"></circle><g id="ticks"></g><line class="hand hour" id="hourHand" x1="50" y1="50" x2="50" y2="30"></line><line class="hand minute" id="minuteHand" x1="50" y1="50" x2="50" y2="22"></line><line class="hand second" id="secondHand" x1="50" y1="55" x2="50" y2="18"></line><circle class="center" cx="50" cy="50" r="2.5"></circle></svg>
<section class="digital"><p class="time"><span id="hm">20:42</span><span class="seconds" id="seconds">:00</span></p><p class="day" id="day">THỨ HAI</p><p class="date" id="date">03 08 2026</p></section>
</main>
<script>
"use strict";
const ticks=document.getElementById("ticks");
for(let i=0;i<60;i++){const line=document.createElementNS("http://www.w3.org/2000/svg","line"),major=i%5===0;line.setAttribute("class",`tick${major?" major":""}`);line.setAttribute("x1","50");line.setAttribute("x2","50");line.setAttribute("y1",major?"6":"7.5");line.setAttribute("y2",major?"12":"10");line.setAttribute("transform",`rotate(${i*6} 50 50)`);ticks.append(line)}
const el={hm:document.getElementById("hm"),seconds:document.getElementById("seconds"),day:document.getElementById("day"),date:document.getElementById("date"),hour:document.getElementById("hourHand"),minute:document.getElementById("minuteHand"),second:document.getElementById("secondHand")};
const DAYS=["CHỦ NHẬT","THỨ HAI","THỨ BA","THỨ TƯ","THỨ NĂM","THỨ SÁU","THỨ BẢY"],pad=n=>String(n).padStart(2,"0");
function parts(){return Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Ho_Chi_Minh",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).formatToParts(new Date()).map(part=>[part.type,part.value]))}
function render(){const t=parts(),h=Number(t.hour),m=Number(t.minute),s=Number(t.second),date=new Date(Number(t.year),Number(t.month)-1,Number(t.day));el.hm.textContent=`${pad(h)}:${pad(m)}`;el.seconds.textContent=`:${pad(s)}`;el.day.textContent=DAYS[date.getDay()];el.date.textContent=`${t.day} ${t.month} ${t.year}`;el.hour.setAttribute("transform",`rotate(${(h%12)*30+m*.5} 50 50)`);el.minute.setAttribute("transform",`rotate(${m*6+s*.1} 50 50)`);el.second.setAttribute("transform",`rotate(${s*6} 50 50)`);document.title=`${pad(h)}:${pad(m)} — Clock`}
render();setInterval(render,1000);
</script>
</body>
</html>
