<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Clock</title>
<style>
:root{--text:#f7f7f7;--muted:#99999e;--line:rgba(255,255,255,.13);--radius:18px}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--text);font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace}
body{display:grid;place-items:center}
.card{
  width:100%;height:100%;min-height:250px;overflow:hidden;border-radius:var(--radius);
  display:grid;grid-template-columns:minmax(150px,.8fr) minmax(170px,1fr);align-items:center;gap:10px;padding:20px;
  background:radial-gradient(circle at 20% 8%,rgba(255,255,255,.055),transparent 35%),linear-gradient(145deg,#18181a,#0f0f10)
}
.face{width:min(170px,43vh,65vw);aspect-ratio:1;margin:auto;overflow:visible}
.face circle.frame{fill:none;stroke:var(--line);stroke-width:.8}
.face .tick{stroke:#9d9da1;stroke-width:.75;stroke-linecap:round}
.face .tick.major{stroke:#eeeeef;stroke-width:1.35}
.face .hour{stroke:#f4f4f4;stroke-width:3.2}
.face .minute{stroke:#d4d4d6;stroke-width:2.2}
.face .second{stroke:#7f7f84;stroke-width:.8}
.face .hand{stroke-linecap:round}
.face .center{fill:#f4f4f4}
.digital{min-width:0}
.time{margin:0;font-size:clamp(34px,7vw,63px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.075em}
.seconds{font-size:.42em;color:var(--muted);letter-spacing:-.04em}
.day{margin:13px 0 0;color:#e8e8e8;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.date{margin:7px 0 0;color:var(--muted);font-size:10px}
.zone{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:9px}
@media(max-width:520px){
  .card{grid-template-columns:1fr;gap:7px;padding:16px}
  .face{width:min(128px,34vh,50vw)}
  .digital{text-align:center}
  .time{font-size:38px}.day{margin-top:9px}.zone{margin-top:10px;padding-top:9px}
}
@media(max-height:285px){
  .card{grid-template-columns:minmax(120px,.7fr) 1fr;padding:13px}
  .face{width:min(116px,39vh)}
  .time{font-size:34px}
}
</style>
</head>
<body>
<main class="card">
  <svg class="face" id="face" viewBox="-3 -3 106 106" aria-hidden="true">
    <circle class="frame" cx="50" cy="50" r="46"></circle>
    <g id="ticks"></g>
    <line class="hand hour" id="hourHand" x1="50" y1="50" x2="50" y2="30"></line>
    <line class="hand minute" id="minuteHand" x1="50" y1="50" x2="50" y2="22"></line>
    <line class="hand second" id="secondHand" x1="50" y1="55" x2="50" y2="18"></line>
    <circle class="center" cx="50" cy="50" r="2.5"></circle>
  </svg>
  <section class="digital">
    <p class="time"><span id="hm">20:42</span><span class="seconds" id="seconds">:00</span></p>
    <p class="day" id="day">THỨ HAI</p>
    <p class="date" id="date">03 · 08 · 2026</p>
    <p class="zone">Giờ Việt Nam · UTC+7</p>
  </section>
</main>
<script>
"use strict";
const tickGroup=document.getElementById("ticks");
for(let i=0;i<60;i++){
  const line=document.createElementNS("http://www.w3.org/2000/svg","line");
  const major=i%5===0;
  line.setAttribute("class",`tick${major?" major":""}`);
  line.setAttribute("x1","50");line.setAttribute("x2","50");
  line.setAttribute("y1",major?"6":"7.5");line.setAttribute("y2",major?"12":"10");
  line.setAttribute("transform",`rotate(${i*6} 50 50)`);
  tickGroup.append(line);
}
const el={
  hm:document.getElementById("hm"),seconds:document.getElementById("seconds"),
  day:document.getElementById("day"),date:document.getElementById("date"),
  hour:document.getElementById("hourHand"),minute:document.getElementById("minuteHand"),second:document.getElementById("secondHand")
};
const DAYS=["CHỦ NHẬT","THỨ HAI","THỨ BA","THỨ TƯ","THỨ NĂM","THỨ SÁU","THỨ BẢY"];
const pad=n=>String(n).padStart(2,"0");
function vietnamParts(){
  const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Ho_Chi_Minh",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false,weekday:"short"}).formatToParts(new Date());
  return Object.fromEntries(parts.map(part=>[part.type,part.value]));
}
function render(){
  const t=vietnamParts(),h=Number(t.hour),m=Number(t.minute),s=Number(t.second);
  const localDate=new Date(Number(t.year),Number(t.month)-1,Number(t.day));
  el.hm.textContent=`${pad(h)}:${pad(m)}`;
  el.seconds.textContent=`:${pad(s)}`;
  el.day.textContent=DAYS[localDate.getDay()];
  el.date.textContent=`${t.day} · ${t.month} · ${t.year}`;
  el.hour.setAttribute("transform",`rotate(${(h%12)*30+m*.5} 50 50)`);
  el.minute.setAttribute("transform",`rotate(${m*6+s*.1} 50 50)`);
  el.second.setAttribute("transform",`rotate(${s*6} 50 50)`);
  document.title=`${pad(h)}:${pad(m)} — Clock`;
}
render();setInterval(render,1000);
</script>
</body>
</html>
